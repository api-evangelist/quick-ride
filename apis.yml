name: Quick Ride
description: 'Quick Ride is an Indian mobility platform offering carpooling, bikepool, and taxi
  services across major cities including Bangalore, Chennai, Mumbai, Pune, Kochi, NCR, and Chandigarh.
  Riders book airport, outstation, rental, and local trips across vehicle classes from hatchbacks to
  luxury SUVs, or share commutes via car and bike pooling to cut cost and congestion. The service is
  delivered through consumer iOS and Android apps. No public developer program, API documentation, or
  machine-readable API surface (OpenAPI, AsyncAPI, MCP, SDKs) is published; this profile was surfaced
  as a portfolio company of prosus-ventures and enriched via live web and DNS/TLS probes.'
